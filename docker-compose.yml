services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: guia_oficios_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: guia_user
      POSTGRES_PASSWORD: guia_password
      POSTGRES_DB: guia_oficios
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guia_user -d guia_oficios"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guia_oficios_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://guia_user:guia_password@postgres:5432/guia_oficios?sslmode=disable"
      JWT_SECRET: "guia-de-oficios-jwt-secret-mvp-2026"
      UPLOAD_DIR: "/app/uploads"
      DD_SERVICE: "guia-de-oficios-api"
      DD_ENV: "dev"
      DD_VERSION: "1.0.0-mvp"
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  uploads_data:
